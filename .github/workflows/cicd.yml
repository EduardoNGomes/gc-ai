name: New Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REPO: eduardongomes/gcai-release

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build linux binary
        run: |
          go build -o gcai ./cmd

      - name: Build MacOS binary
        run: |
          GOOS=darwin GOARCH=amd64 go build -o gcai-macos ./cmd

      - name: Build Windows binary
        run: |
          GOOS=windows GOARCH=amd64 go build -o gcai-windows.exe ./cmd

      - name: Checkout target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO }}
          token: ${{ secrets.PAT }}
          path: target-repo

      - name: Copy build artifact
        run: cp gcai gcai-macos gcai-windows.exe target-repo/

      - name: Commit and push to target repo
        run: |
          cd  target-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Release ${{ github.event.release.tag_name }}"
          git push
