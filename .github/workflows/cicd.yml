name: New Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REPO: eduardongomes/gcai-release

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build linux binary
        run: go build -ldflags="-s -w" -o gcai ./cmd

      - name: Build Windows binary
        run: GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o gcai-windows.exe ./cmd

      - name: Upload Linux and Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-ubuntu
          path: |
            gcai
            gcai-windows.exe

  build-macos:
    runs-on: macos-latest
    env:
      REPO: eduardongomes/gcai-release

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build MacOS Arm
        run: GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o gcai-macos-arm ./cmd

      - name: Codesign MacOS Arm binary
        run: codesign -s - --deep -f gcai-macos-arm

      - name: Build MacOS binary
        run: GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o gcai-macos ./cmd

      - name: Codesign MacOS binary
        run: codesign -s - --deep -f gcai-macos

      - name: Upload MacOS binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-macos
          path: |
            gcai-macos-arm
            gcai-macos

  deploy:
    runs-on: ubuntu-latest
    needs: [build, build-macos]
    env:
      REPO: eduardongomes/gcai-binaries

    steps:
      - name: Download Linux and Windows binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-ubuntu
          path: .

      - name: Download MacOS binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-macos
          path: .

      - name: Checkout target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO }}
          token: ${{ secrets.PAT }}
          path: target-repo

      - name: Copy build artifacts
        run: cp gcai gcai-macos gcai-macos-arm gcai-windows.exe target-repo/

      - name: Commit and push to target repo
        run: |
          cd target-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Release ${{ github.event.release.tag_name }}"
          git push
