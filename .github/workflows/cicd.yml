name: New Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REPO: eduardongomes/gcai-release

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build linux binary
        run: go build -ldflags="-s -w" -o gcai ./cmd

      - name: Build Windows binary
        run: GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o gcai-windows.exe ./cmd

      - name: Upload Linux and Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-ubuntu
          path: |
            gcai
            gcai-windows.exe

  build-macos:
    runs-on: macos-latest
    env:
      REPO: eduardongomes/gcai-release

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build MacOS Arm
        run: GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o gcai-macos-arm ./cmd

      - name: Codesign MacOS Arm binary
        run: codesign -s - --deep -f gcai-macos-arm

      - name: Build MacOS binary
        run: GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o gcai-macos ./cmd

      - name: Codesign MacOS binary
        run: codesign -s - --deep -f gcai-macos

      - name: Upload MacOS binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-macos
          path: |
            gcai-macos-arm
            gcai-macos
  deploy-release:
    runs-on: ubuntu-latest
    needs: [build, build-macos]

    steps:
      - name: Download Linux and Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: binaries-ubuntu
          path: .

      - name: Download MacOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: binaries-macos
          path: .

      - name: Create release in gcai-binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          name: ${{ github.event.release.name }}
          body: ${{ github.event.release.body }}
          repository: "EduardoNGomes/gcai-binaries"
          token: ${{ secrets.PAT }}
          files: |
            gcai
            gcai-windows.exe
            gcai-macos
            gcai-macos-arm
